# PaperMono board peripherals
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_I2S=y
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_LED=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_FT5336=n
CONFIG_PAPERMONO_FT6336=y
# PaperMono already turns completed touch sequences into application events.
# Process Zephyr input callbacks in the dedicated 4 KiB FT6336 polling thread.
# This avoids both the low-priority generic input queue and the global 1 KiB
# system workqueue while Wi-Fi/BLE and e-paper work are active. The generic
# LVGL pointer is unused and would mirror the same events into a second queue.
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=n
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y
CONFIG_RTC=y
CONFIG_RTC_RX8130CE=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_UPDATE=y
CONFIG_RTC_CALIBRATION=y
CONFIG_RTC_INIT_PRIORITY=75
CONFIG_GPIO_HOGS_INIT_PRIORITY=65
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
# fs_mkfs() is linked in so an explicitly-confirmed user action can provision a
# card that has no mountable FAT (many cards ship exFAT/GPT). Nothing formats
# automatically unless PAPERMONO_TF_FORMAT_WHEN_UNFORMATTED is enabled.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_FS_FATFS_CODEPAGE=936
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_NUM_FILES=6
CONFIG_FS_FATFS_NUM_DIRS=4
CONFIG_LORA=y
CONFIG_CRC=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
# The legacy loramac-node selector defaults on for every SX1262 devicetree
# node even when that optional module is absent. The native driver below is
# independent of it.
CONFIG_LORA_SX126X=n

# ESP32-S3 Wi-Fi station support. Network credentials are never compiled into
# the firmware; the driver can scan immediately and applications may connect
# through Zephyr's Wi-Fi management API.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
# AP provisioning and the station connection overlap briefly. Zephyr keeps
# IPv4 interface state in a fixed-size pool, so AP+STA requires two slots.
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
# Two clients, so one connection that is opened and then stalls (a suspended
# browser tab, a client killed mid-upload) cannot lock every other browser out.
# Zephyr removes the listening socket from its poll set while `concurrent`
# clients are connected and refreshes the inactivity timer on any received
# byte, so a single wedged connection used to block the content center until
# the 10 s idle timeout - which a slow sender can avoid indefinitely.
CONFIG_HTTP_SERVER_MAX_CLIENTS=2
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_STACK_SIZE=6144
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
# The Wi-Fi sockets service and HTTP server each own one control eventfd.
CONFIG_ZVFS_EVENTFD_MAX=2
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=7
CONFIG_HTTP_SERVER_CAPTURE_HEADER_BUFFER_SIZE=1024
# The web client uses base64url for names, so 255 UTF-8 bytes fit in 340 bytes.
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=512
CONFIG_JSON_LIBRARY=y
CONFIG_SNTP=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# Standard composite BLE HID remote. ESP32 software coexistence is selected
# automatically when both the Wi-Fi and Bluetooth controllers are enabled.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=1
# Prefer a 15 ms HID connection interval; the central chooses the applied value.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_MAX_PAIRED=4
# SMP completion, bond persistence and restored GATT subscriptions run on the
# Bluetooth RX workqueue. The 1200-byte default overflows after Mac pairing.
CONFIG_BT_RX_STACK_SIZE=2048
# Match the ESP32-S3 controller's ACL packet count. With the default (10) the
# host logs "Num of Controller's ACL packets != ACL bt_conn_tx contexts
# (12 != 10)" and can run out of TX contexts under HID load, dropping reports.
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_DEVICE_NAME="PaperMono C153"
CONFIG_BT_DEVICE_APPEARANCE=960
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y

# Keep the Wi-Fi adapter and packet allocations out of scarce internal DRAM.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536

# LVGL renders one complete monochrome frame. The EPD driver groups each LVGL
# draw cycle into one physical full or partial refresh.
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_Z_VDB_CUSTOM_SECTION=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_FONT_FMT_TXT_LARGE=y
# The complete 1-bit Chinese font is linked from src/generated instead.
CONFIG_LV_FONT_SOURCE_HAN_SANS_SC_16_CJK=n

# Persistent application settings use the board's 192 KiB storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_POWEROFF=y

# Production pairing and session credentials must use the ESP32-S3 TRNG.
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y

# Diagnostics over the ESP32-S3 USB Serial/JTAG console.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LORA_LOG_LEVEL_INF=y
CONFIG_MAIN_STACK_SIZE=8192
# Status LED work reaches the PMIC/I2C driver and scheduler on this stack.
# The 1 KiB Zephyr default overflows during CONNECTING and corrupts the main
# thread's saved context. Keep headroom for radio and board work callbacks.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
# The C153 exposes only the ESP32-S3 native USB console. Keep startup pending
# briefly so a host can reconnect after flashing/reset and receive the first
# display-initialization result instead of losing it during re-enumeration.
CONFIG_BOOT_DELAY=3000

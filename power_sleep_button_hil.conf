# Explicit opt-in HIL: ESP deep sleep, then short-click the M5PM1 power key.
# This is distinct from PMIC shutdown, whose button wake is a cold power-on.
CONFIG_POWEROFF=y
CONFIG_PAPERMONO_POWER_HIL_DEEP_SLEEP_POWER_BUTTON=y
CONFIG_PAPERMONO_POWER_HIL_DELAY_SECONDS=3
CONFIG_PAPERMONO_POWER_HIL_USB_RECONNECT_DELAY_MS=1500

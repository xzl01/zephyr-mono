# Explicit opt-in HIL: provision a TF card that has no mountable FAT
# filesystem (exFAT or GPT-partitioned cards are common out of the box).
#
# DESTRUCTIVE. Every partition and file on the card is erased. Only use this
# with a scratch card whose contents you do not need.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_PAPERMONO_TF_FORMAT_WHEN_UNFORMATTED=y
